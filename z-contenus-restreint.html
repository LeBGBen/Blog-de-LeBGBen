<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles-lebgben.css">
        <script src="navigation.js"></script>
        <title>Blog de LeBGBen - Mes contenus</title>
    </head>
    <body>
        <header>
            <h1>Mes contenus, <span class="avertissement">/!\ Public restreint !</span></h1>
            <nav id="nav"></nav><script>nav();</script>
        </header>
        <p>Entrez le code d'accès pour télécharger le fichier.</p>
        <div>
            <input type="password" id="acces" placeholder="Entrez le code d'accès" style="width: 30vmax; max-width: 80vw;">
            <button type="submit" id="b-acces">Entrer</button>
        </div>
        <p>Mode d'emploi : vous devez modifier l'extension du fichier téléchargé sur .zip, extraire le fichier interne et répéter cette opération pour chaque fichier, jusqu'à trouver les contenus.</p>
        <script src="protected-pages-input.js"></script>
        <script>

document.getElementById('b-acces').addEventListener('click', function () {
    var code = document.getElementById('acces').value.trim();

    if (!code) {
        window.location.href = 'erreur-systeme.html';
        return;
    }

    if (protectedPages.indexOf(code) !== -1) {
        window.location.href = 'erreur-systeme.html';
        return;
    }

    var targetUrl = 'contents/(!)-content/' + code + '.html';

    fetch(targetUrl, { method: 'GET' })
    .then(function (response) {
        if (response.ok && protectedPages.indexOf(code) === -1) {
            window.location.href = targetUrl;
        } else {
            window.location.href = 'erreur-systeme.html';
        }
    })
    .catch(function () {
        window.location.href = 'erreur-systeme.html';
    });
});

document.getElementById('acces').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('b-acces').click();
    }
});

        </script>
